name: DCO

on:
  pull_request:
    branches: [main]
    # `ready_for_review` обязателен вместе с условием на черновик ниже: без него
    # снятие черновика не пересчитало бы проверку, и PR остался бы с вердиктом,
    # относящимся к другому состоянию.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  dco-check:
    name: Signed-off-by check
    # ЧЕРНОВИК НЕ ПРОВЕРЯЕТСЯ, и это не послабление. Подпись удостоверяет
    # происхождение кода, ПРИХОДЯЩЕГО в main через PR (AGENTS.md, уточнено
    # 2026-08-18: на коммитах самого main её нет и не требуется). Черновой PR
    # ничего не приносит — окна открывают его как обвязку, чтобы получить CI на
    # свою ветку, и требовать подпись на каждом промежуточном коммите значит
    # заставлять переписывать историю живой ветки по десять раз.
    #
    # Гарантия сохранена ровно там, где она нужна: как только PR снимают с
    # черновика, проверка запускается (см. `ready_for_review`) и обязана быть
    # зелёной до слияния. Реестр 221.1, PR #4 (ветка окна 274).
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            author_name=$(git log -1 --format='%an' "$sha")
            author_email=$(git log -1 --format='%ae' "$sha")
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if ! git log -1 --format='%B' "$sha" | grep -qiF "$expected"; then
              echo "::error::commit $sha is missing '$expected'"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "Add a sign-off to your commits with 'git commit -s' or"
            echo "'git rebase --signoff ${BASE_SHA}'. See CONTRIBUTING.md."
            exit 1
          fi
