name: nova-test-regression

# Plan 169.1.1: Автоматический регресс nova_tests на каждый коммит.
# PR/push — быстрый (positive+fast); nightly — полный (--full).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  nova-test-fast:
    name: nova test / positive-fast (PR + push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        # libmbedtls-dev: detect_mbedtls (test_runner.rs) находит /usr/include/mbedtls/
        # → std/tls-шим собирается с реальным mbedTLS (не stub) → TLS-тесты (cert_modes)
        # проходят в std-гейте. ubuntu-latest=24.04(noble) на деле ставит mbedTLS
        # 2.28.8 (пакет libmbedtls-dev), НЕ 3.6.x — шим version-guard'ed через
        # MBEDTLS_VERSION_NUMBER под обе ветки API (cigreen-fix, было падение
        # CC-FAIL на undeclared 3.x-символах).
        run: sudo apt-get install -y libgc-dev libmbedtls-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      # Plan 196 Ф.4c — регресс-гард пути `nova build`. Он молча НЕ кормил
      # checker-каналы (resolved_types/callees), которые `nova test` кормит, →
      # ЛЮБОЙ `nova build` (вкл. `fn main(){}`) падал в P67-LEGACY ICE в codegen.
      # conformance/nova test не ловили (иная reachability). Починено febfc83be;
      # этот хард-фейл шаг держит `nova build` живым (нельзя убрать в continue-on-error).
      - name: nova build smoke (Plan 196 — nova build ICE regression guard)
        run: |
          printf 'fn main() {\n    println("hello, nova build")\n}\n' > /tmp/nova_build_smoke.nv
          ./nova-cli/target/release/nova build /tmp/nova_build_smoke.nv
      # nova_tests/ — НЕ гейт корректности (deprecated per-plan-фикстуры, под
      # удаление; настоящие гейты — conformance + std/module *_test.nv). Держим
      # как non-blocking сигнал, а не хард-фейл (решение 2026-07-11).
      - name: Run nova_tests (positive-fast, default, non-blocking)
        continue-on-error: true
        run: ./nova-cli/target/release/nova test nova_tests
      # Тот же страж, что гоняет локальный гейт: сверяет ИМЕНА отказов с
      # базой известных (scripts/guards/std-test-fail.baseline), а не валится
      # на любом. Раньше здесь стоял голый `nova test std`, у CI базы не было,
      # и дорожка была красной постоянно от уже заведённых дефектов — реестр
      # 221.1 №591/№402. Два гейта обязаны проверять ОДНО И ТО ЖЕ.
      - name: Run std tests (against the known-failure baseline)
        run: bash scripts/guards/check-std-test-baseline.sh . ./nova-cli/target/release/nova

  nova-test-nightly-full:
    name: nova test / full (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        # libmbedtls-dev: detect_mbedtls (test_runner.rs) находит /usr/include/mbedtls/
        # → std/tls-шим собирается с реальным mbedTLS (не stub) → TLS-тесты (cert_modes)
        # проходят в std-гейте. ubuntu-latest=24.04(noble) на деле ставит mbedTLS
        # 2.28.8 (пакет libmbedtls-dev), НЕ 3.6.x — шим version-guard'ed через
        # MBEDTLS_VERSION_NUMBER под обе ветки API (cigreen-fix, было падение
        # CC-FAIL на undeclared 3.x-символах).
        run: sudo apt-get install -y libgc-dev libmbedtls-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      # nova_tests/ non-blocking (см. positive-fast) — отчёт для трекинга дрейфа.
      - name: Run nova_tests full (non-blocking report)
        continue-on-error: true
        run: ./nova-cli/target/release/nova test --full nova_tests 2>&1 | tee nova-test-full-report.txt
      # Тот же страж, что гоняет локальный гейт: сверяет ИМЕНА отказов с
      # базой известных (scripts/guards/std-test-fail.baseline), а не валится
      # на любом. Раньше здесь стоял голый `nova test std`, у CI базы не было,
      # и дорожка была красной постоянно от уже заведённых дефектов — реестр
      # 221.1 №591/№402. Два гейта обязаны проверять ОДНО И ТО ЖЕ.
      - name: Run std tests (against the known-failure baseline)
        run: bash scripts/guards/check-std-test-baseline.sh . ./nova-cli/target/release/nova
      - name: Upload full test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-test-full-report
          path: nova-test-full-report.txt
          retention-days: 30
