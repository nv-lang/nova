name: windows-oracle-package

# Private, manual-only packaging path for the owner-approved Oracle Windows
# asset. This creates an Actions artifact only: no release, tag, or publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows-oracle:
    name: Build, package, and smoke-test Windows Oracle
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout dispatched revision and submodules
        uses: actions/checkout@v4
        with:
          # The workflow_dispatch branch picker selects the source ref (main by
          # default); github.sha is its immutable dispatch-time commit, unlike a
          # later fetch of a moving branch name.
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Report exact source revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          "Selected ref: ${{ github.ref }}" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
          "Dispatched source SHA: ${{ github.sha }}" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Checked out SHA: $actual" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($actual -ne "${{ github.sha }}") {
            throw "Checkout SHA mismatch: expected ${{ github.sha }}, got $actual"
          }
          "NOVA_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Build pinned Boehm GC with LARGE_CONFIG for x64 static Windows
        shell: pwsh
        run: |
          $gcSource = Join-Path $PWD "compiler-codegen/nova_rt/gc"
          $gcBuild = Join-Path $env:RUNNER_TEMP "oracle-gc-build"
          $gcRoot = Join-Path $PWD "compiler-codegen/vcpkg_installed/x64-windows-static"
          cmake -S $gcSource -B $gcBuild -A x64 -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -Denable_large_config=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw "Boehm GC configuration failed: exit=$LASTEXITCODE" }
          cmake --build $gcBuild --config Release --target gc --parallel
          if ($LASTEXITCODE -ne 0) { throw "Boehm GC build failed: exit=$LASTEXITCODE" }
          $include = New-Item -ItemType Directory -Force (Join-Path $gcRoot "include")
          $lib = New-Item -ItemType Directory -Force (Join-Path $gcRoot "lib")
          $gcInclude = New-Item -ItemType Directory -Force (Join-Path $include "gc")
          Copy-Item (Join-Path $gcBuild "Release/gc.lib") $lib
          Copy-Item (Join-Path $gcSource "include/gc*.h") $gcInclude
          Copy-Item (Join-Path $gcSource "include/extra/gc*.h") $include
          $atomic = Join-Path $PWD "compiler-codegen/nova_rt/libatomic_ops/src"
          Copy-Item (Join-Path $atomic "atomic_ops*.h") $include
          Copy-Item (Join-Path $atomic "atomic_ops") $include -Recurse
          $version = git -C $gcSource describe --tags --always
          "Boehm GC: $version, x64 MSVC Release, static library and CRT, LARGE_CONFIG" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Build Nova CLI and LSP from dispatched source
        shell: pwsh
        run: |
          $manifest = Get-Content nova-cli/Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Oracle package version missing from nova-cli/Cargo.toml"
          }
          "NOVA_ORACLE_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cargo build --release --manifest-path nova-cli/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "nova-cli release build failed: exit=$LASTEXITCODE" }
          Push-Location nova-lsp
          try {
            cargo build --release
            if ($LASTEXITCODE -ne 0) { throw "nova-lsp release build failed: exit=$LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Package and run clean-extraction default-GC smoke test
        shell: pwsh
        run: |
          $out = Join-Path $PWD "dist\windows-oracle"
          ./scripts/package-release.ps1 -SkipBuild -ProductName nova-oracle -Version $env:NOVA_ORACLE_VERSION -Architecture x86_64 -VcpkgBase (Join-Path $PWD "compiler-codegen\vcpkg_installed\x64-windows-static") -OutDir $out -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw "Windows Oracle packaging/smoke test failed: exit=$LASTEXITCODE" }
          $zip = Join-Path $out "nova-oracle-${{ env.NOVA_ORACLE_VERSION }}-windows-x86_64.zip"
          $sha = "$zip.sha256"
          if (-not (Test-Path $zip)) { throw "Expected package not produced: $zip" }
          if (-not (Test-Path $sha)) { throw "Expected checksum not produced: $sha" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $roots = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/').Split('/')[0] } | Sort-Object -Unique)
            if ($roots.Count -ne 1 -or $roots[0] -ne "nova-oracle-${{ env.NOVA_ORACLE_VERSION }}-windows-x86_64") {
              throw "Unexpected top-level zip entries: $($roots -join ', ')"
            }
            if (-not ($archive.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq "nova-oracle-${{ env.NOVA_ORACLE_VERSION }}-windows-x86_64/nova.exe" })) {
              throw "Package lacks its top-level nova.exe"
            }
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "Package: $zip" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA256: $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Top-level folder: nova-oracle-${{ env.NOVA_ORACLE_VERSION }}-windows-x86_64/" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload private Actions artifact (zip + SHA256)
        uses: actions/upload-artifact@v4
        with:
          name: nova-oracle-${{ env.NOVA_ORACLE_VERSION }}-windows-x86_64-${{ github.sha }}
          path: |
            dist/windows-oracle/nova-oracle-${{ env.NOVA_ORACLE_VERSION }}-windows-x86_64.zip
            dist/windows-oracle/nova-oracle-${{ env.NOVA_ORACLE_VERSION }}-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
