name: windows-process-acceptance

# ЗАЧЕМ. План 294 (потоки дочернего процесса / PTY), риск R9: все остальные
# задания здесь на Linux, и Windows-половина приёмки (`cmd.exe`/`ping`-ветки
# `#cfg(target_os = "windows")`, `uv_spawn`, потом ConPTY) не получала машинного
# вердикта. Это задание его даёт. Слово владельца 2026-10-08 («да» на Windows-задание), задача #40.
#
# НЕ ОБЯЗАТЕЛЬНОЕ. Имя workflow НЕ входит в `REQUIRED` в
# `scripts/guards/check-push-proven-by-ci.py`, поэтому красный прогон не блокирует
# пуш в main. Сделать его обязательным может только интегратор отдельным словом
# (после первой недели зелёного): тогда имя добавляется в `REQUIRED` этого стража.
#
# ЧТО ГОНЯЕТ. Сборка `nova-cli` (release) и точечный набор `nova test std --filter os/`
# (std/src/os/d453_os_process_run_test.nv — реальный spawn + wait + код возврата,
# supervised(timeout:)). Когда Ф.1 плана 294 принесёт фикстуры потоков/PTY, их
# файлы живут в `std/src/os/` и попадают под тот же фильтр; расширять набор —
# правкой `FILTER` ниже.
#
# GC и libuv. vcpkg НЕ нужен: при отсутствии `gc.lib` `nova` собирает bdwgc из
# сабмодуля (~10 с, #269 Ф.2), libuv собирается из сабмодуля при первом `test`.
# Тулчейн — MSVC (VS 2022 есть на windows-latest, vcvars находится через vswhere).
# apt здесь нет и быть не должно (`scripts/tools/ci-apt-install.sh` — только Linux).
#
# ВРЕМЯ И КЭШИ. Холодный прогон: сборка nova-cli release ~8-12 мин на windows-latest,
# libuv+bdwgc+rt-архив ~1-2 мин, фикстуры ~1-3 мин; предел задания 45 мин. Кэшируются
# реестр/git cargo, `nova-cli/target` и `target/libuv-cache` (ключ — Cargo.lock);
# тёплый прогон ожидается 3-6 мин. Цифры факта — в плане 294, раздел CI.

on:
  push:
    branches: [integrate, 'integrate/**']
  pull_request:
    paths:
      - ".github/workflows/windows-process-acceptance.yml"
      - "std/src/os/**"
      - "compiler-codegen/nova_rt/**"
  workflow_dispatch:

concurrency:
  group: windows-process-acceptance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-process:
    name: nova test std/os on windows-latest (non-required)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FILTER: os/
    steps:
      - name: Checkout nova (submodules recursive — nova_rt/libuv, gc, libatomic_ops)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain (rustup, pinned to MSRV 1.85)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache cargo registry + targets + libuv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nova-cli/target
            target/libuv-cache
          key: ${{ runner.os }}-windows-process-${{ hashFiles('nova-cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-process-

      - name: Build nova-cli (release)
        shell: bash
        run: |
          echo "building nova-cli on $RUNNER_OS"
          cargo build --release --manifest-path nova-cli/Cargo.toml

      - name: nova test std (process fixtures, MSVC)
        shell: bash
        run: |
          echo "running: nova test std --filter $FILTER"
          ./nova-cli/target/release/nova test std --filter "$FILTER" --toolchain msvc --timeout 120
