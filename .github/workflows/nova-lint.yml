name: nova-lint

# Plan 185 + governance (2026-07-10, «nova lint использовать по максимуму
# автоматически»): CI-гейт конвенционных W_*-правил (реестр
# compiler-codegen/src/lints.rs::CONV_RULES, запуск `nova lint`).
#
# ИСТОРИЯ (2026-07-10): при введении этого workflow полный `nova lint std`
# нёс 15 pre-existing находок (std/tls/*, std/data/semver_range.nv,
# std/encoding/toml.nv, std/http/transport/real.nv, std/time/civil/tzif.nv),
# а `nova lint spec_tests` — 13 (conformance-фикстуры). Поэтому оба полных
# прогона были ВРЕМЕННО оставлены информационными (`continue-on-error`).
#
# САНАЦИЯ ЗАВЕРШЕНА (ветка lint-sanitation, 2026-07-10): все 15 std + 13
# spec_tests находок разобраны (реальные фиксы на канон, ни одного
# подавления-маркером в обход). `nova lint std` = 0 И `nova lint spec_tests`
# = 0. Поэтому ОБА полных прогона ТЕПЕРЬ — ЖЁСТКИЕ ГЕЙТЫ (см. ниже).
#
# Периметр гейтов:
#   - Полный `nova lint std` (ВСЕ правила реестра) — ЖЁСТКИЙ ГЕЙТ:
#     подтверждено 0 находок после lint-sanitation. Ловит ЛЮБОЙ новый
#     конвенционный дрейф в std/ на PR (не только W_LEADING_BINOP).
#   - Полный `nova lint spec_tests` (ВСЕ правила) — ЖЁСТКИЙ ГЕЙТ:
#     подтверждено 0 находок. `neg/`-фикстуры (намеренно неканоничный код
#     EXPECT_COMPILE_ERROR) и `lint/`-фикстуры (spec_tests/conformance/lint/,
#     Plan 198) автоматически скипаются lint-walker'ом (nova-cli/src/main.rs
#     cmd_lint: `is_neg_fixture` / `is_lint_fixture`), гейтить их не надо.
#   - Самотест реестра (conv_pos.nv/conv_clean.nv,
#     spec_tests/conformance/lint/) — ЖЁСТКИЙ ГЕЙТ: регресс-гвард на сам
#     МЕХАНИЗМ (правило перестало срабатывать / фикстура сломана), не на
#     корпус. conv_pos.nv НАМЕРЕННО содержит находки — вызывается напрямую
#     по точному пути к файлу, что обходит авто-скип `is_lint_fixture`
#     (тот действует только при рекурсивном обходе директории).
#   - Полный `nova lint nova_tests` — НЕ гейт (`continue-on-error`):
#     legacy-корпус (полу-сломанный, дублированный, помечен на удаление —
#     см. spec_tests/nova.toml) несёт pre-existing находки по правилам вне
#     периметра lint-sanitation-волны (та санировала std + spec_tests).
#     Санация nova_tests не окупается (корпус удаляется) — job
#     информационный.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  nova-lint-leading-binop-nova-tests-gate:
    name: nova lint W_LEADING_BINOP_CONTINUATION (nova_tests, gate)
    # std покрыт полным `nova lint std`-гейтом ниже (все правила, включая
    # W_LEADING_BINOP). Этот job сохраняет ТОЧЕЧНЫЙ гейт W_LEADING_BINOP по
    # nova_tests — legacy-корпус целиком НЕ гейтится (debt), но именно это
    # footgun-правило (ведущий `||` → тихий always-true miscompile,
    # D417-класс) на нём держим жёстко.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      - name: nova lint --rule W_LEADING_BINOP_CONTINUATION nova_tests, excl. self-test fixtures (must be clean)
        run: ./nova-cli/target/release/nova lint --rule W_LEADING_BINOP_CONTINUATION --skip nova_tests/lint nova_tests

  nova-lint-std-gate:
    name: nova lint std full (all rules — HARD GATE, must be clean)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      # Plan 185 Ф.3-хвост / Plan 212 №6 (2026-07-18): --deny включён — W→E,
      # ненулевые находки = жёсткий exit≠0 самим CLI (не парсингом вывода).
      - name: nova lint --deny std (all conv rules — 0 findings required)
        run: ./nova-cli/target/release/nova lint --deny std

  nova-lint-spec-tests-gate:
    name: nova lint spec_tests full (all rules — HARD GATE, must be clean)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      # Plan 185 Ф.3-хвост / Plan 212 №6 (2026-07-18): --deny включён.
      - name: nova lint --deny spec_tests (all conv rules — 0 findings required; neg/ auto-skipped)
        run: ./nova-cli/target/release/nova lint --deny spec_tests

  nova-lint-registry-self-test:
    name: nova lint self-test (conv_pos/conv_clean regression guard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      - name: conv_pos.nv must still trigger findings (registry fires)
        run: |
          set +e
          ./nova-cli/target/release/nova lint --deny spec_tests/conformance/lint/conv_pos.nv
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::spec_tests/conformance/lint/conv_pos.nv expected lint findings (exit 1) but got exit 0 — a conv rule stopped firing (see spec_tests/conformance/lint/conv_pos.nv header for the expected-findings list)"
            exit 1
          fi
      - name: conv_clean.nv must stay clean (no false positives)
        run: ./nova-cli/target/release/nova lint --deny spec_tests/conformance/lint/conv_clean.nv

  nova-lint-nova-tests-full-debt:
    name: nova lint nova_tests full (informational — legacy corpus debt, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      - name: nova lint nova_tests (excl. self-test fixtures; legacy debt, non-blocking)
        run: ./nova-cli/target/release/nova lint --skip nova_tests/lint nova_tests
