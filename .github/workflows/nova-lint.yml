name: nova-lint

# Plan 185 + governance (2026-07-10, «nova lint использовать по максимуму
# автоматически»): CI-гейт конвенционных W_*-правил (реестр
# compiler-codegen/src/lints.rs::CONV_RULES, запуск `nova lint`).
#
# ВАЖНО (найдено при введении этого workflow, 2026-07-10): предполагалось,
# что полный `nova lint std` уже чист (0 находок) и его можно гейтить целиком.
# Проверка эмпирически ОПРОВЕРГЛА это: полный `nova lint std` даёт 15
# pre-existing находок (std/tls/* — свежесмерженная ветка tls-116;
# + std/data/semver_range.nv, std/encoding/toml.nv, std/http/transport/real.nv,
# std/time/civil/tzif.nv — из более раннего кода), ни одна НЕ относится к
# W_LEADING_BINOP_CONTINUATION и ни одна не внесена этой волной (правки этой
# волны — только compiler-codegen/src/lints.rs + test_runner.rs, ни один .nv
# не тронут). Санация этого долга — отдельная задача, не входит в периметр
# волны, вводящей этот workflow.
#
# Периметр гейтов:
#   - `W_LEADING_BINOP_CONTINUATION` по std/ И nova_tests/ (искл.
#     nova_tests/lint/ — self-test фикстуры, см. ниже) — ЖЁСТКИЙ ГЕЙТ:
#     подтверждено 0 находок по обоим корпусам при введении правила.
#   - Самотест реестра (conv_pos.nv/conv_clean.nv, nova_tests/lint/) —
#     ЖЁСТКИЙ ГЕЙТ: регресс-гвард на сам МЕХАНИЗМ (правило перестало
#     срабатывать / фикстура сломана), не на корпус. conv_pos.nv НАМЕРЕННО
#     содержит находки (в т.ч. одну W_LEADING_BINOP_CONTINUATION) — поэтому
#     исключается из корпусных гейтов выше через `--skip nova_tests/lint`.
#   - Полный `nova lint` (все правила) по std/ И по nova_tests/ — НЕ гейт
#     (`continue-on-error`): оба корпуса несут pre-existing находки по ДРУГИМ
#     правилам вне периметра текущей волны — жёсткий гейт сразу покраснил бы
#     CI на main. Jobs информационные (санация — отдельная задача), не
#     блокируют merge.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  nova-lint-leading-binop-gate:
    name: nova lint W_LEADING_BINOP_CONTINUATION (std + nova_tests, gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      - name: nova lint --rule W_LEADING_BINOP_CONTINUATION std (must be clean)
        run: ./nova-cli/target/release/nova lint --rule W_LEADING_BINOP_CONTINUATION std
      - name: nova lint --rule W_LEADING_BINOP_CONTINUATION nova_tests, excl. self-test fixtures (must be clean)
        run: ./nova-cli/target/release/nova lint --rule W_LEADING_BINOP_CONTINUATION --skip nova_tests/lint nova_tests

  nova-lint-registry-self-test:
    name: nova lint self-test (conv_pos/conv_clean regression guard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      - name: conv_pos.nv must still trigger findings (registry fires)
        run: |
          set +e
          ./nova-cli/target/release/nova lint nova_tests/lint/conv_pos.nv
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::nova_tests/lint/conv_pos.nv expected lint findings (exit 1) but got exit 0 — a conv rule stopped firing (see nova_tests/lint/conv_pos.nv header for the expected-findings list)"
            exit 1
          fi
      - name: conv_clean.nv must stay clean (no false positives)
        run: ./nova-cli/target/release/nova lint nova_tests/lint/conv_clean.nv

  nova-lint-std-full-debt:
    name: nova lint std full (informational — pre-existing debt, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      - name: nova lint std (pre-existing debt outside this wave's perimeter, non-blocking)
        run: ./nova-cli/target/release/nova lint std

  nova-lint-nova-tests-full-debt:
    name: nova lint nova_tests full (informational — pre-existing debt, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get install -y libgc-dev
      - name: Build nova-cli (release)
        run: cargo build --release --manifest-path nova-cli/Cargo.toml
      - name: nova lint nova_tests (excl. self-test fixtures; pre-existing debt, non-blocking)
        run: ./nova-cli/target/release/nova lint --skip nova_tests/lint nova_tests
