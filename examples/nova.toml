# nova.toml — Nova examples package.
#
# Это workspace-member корневого `../nova.toml`. Содержит
# демонстрационные программы и tutorial snippets, организованные
# по подкаталогам:
#
#   basics/         Hello, arithmetic, match, records, strings
#   effects/        Эффекты и handler'ы (D61, D63, D64)
#   real_world/     Полноразмерные примеры (orm_decorators, orm_demo)
#   ffi/, net/, tls/, typed_pointers/, plan110/ — тематические demo
# Каталога-карантина здесь больше нет. `_wip/` удалён 2026-08-10 (запись
# реестра №533): исключение без срока и без владельца копило несобирающийся
# код четыре недели. Всё, что лежит под examples/, обязано компилироваться.
#
# Стандартная библиотека (черновики и production-код) живёт в
# отдельном workspace-member `std/` — см. spec/decisions/07-modules.md
# раздел «Структура nova-lang репозитория» в D78.

[package]
name = "nova_examples"
version = "0.1.0"
nova-version = "0.5"
license = "MIT OR Apache-2.0"
description = "Демонстрационные программы и tutorial snippets Nova"
repository = "https://github.com/nv-lang/nova.git"

# Корень — текущий каталог `.` вместо стандартного `src/`,
# потому что demo-файлы лежат в подкаталогах прямо в examples/,
# не в examples/src/.
[lib]
src = "."

# Большинство demo-файлов self-contained (только prelude). `std.*` доступен
# ВСЕГДА неявно (D78 — reserved implicit stdlib package, не объявляется
# здесь). Внешние (не-std) пакеты нужно объявлять явно — как `tls`/`http`
# ниже (Plan 193: nova-tls, extracted std/tls, `examples/tls/echo_*.nv`
# демонстрирует native-module dependency pattern, симметрично `std/nova.toml`;
# Plan 203: nova-http, extracted std/http, `examples/flagship/aggregator`
# потребляет `http.server` тем же путём).
#
# [M-187-weather-live-tls-diamond-blocked] fix (Plan 204 дофикс №3, D420):
# `tls` объявлен здесь В ТОЙ ЖЕ канонической git+version форме, что и
# `nova-http/nova.toml`'s собственный `tls`-dep (тот же URL/версия) — оба
# вхождения пакета `tls` в графе (прямое здесь + транзитивное через `http`)
# резолвятся к ОДНОМУ git-checkout'у (git_cache пин-таблица ключуется по
# URL), lock содержит `tls` РОВНО ОДИН раз. `path`-override для локальной
# разработки (без re-tag/push нового nova-tls на каждой итерации) —
# `nova.local.toml` (не коммитится) — теперь корректно перекрывает ОБА
# вхождения (прямое root'а И транзитивное через `http`), см. дофикс №3 в
# `imports.rs::lookup_dependency` / D420 (09-tooling.md).
[dependencies]
tls = { git = "https://github.com/nv-lang/nova-tls", version = "0.1" }
# №444/CI: `path`-зависимость в КОММИТИМОМ манифесте нерезолвима на CI (там нет
# соседних реп) — именно она красила `nova-gate` на шаге «Flagship examples gate»
# сообщением «резолюция зависимостей: зависимость `http`: path ../../nova-http».
# Локальная разработка ведётся через `nova.override.toml` (не коммитится), а
# манифест обязан ссылаться на ОПУБЛИКОВАННОЕ. У `nova-http` теги есть (v0.1.0…v0.1.2).
http = { git = "https://github.com/nv-lang/nova-http", version = "0.1" }
polaris = { git = "https://github.com/nv-lang/nova-polaris", version = "0.1" }
# Plan 249 (examples/flagship/http_socks5_bridge). Wired 2026-08-09: both blockers
# are gone — `nova-socks` now publishes `v0.1.0` on all three mirrors (verified
# with `git ls-remote --tags`, so D420 §4 lock RESOLUTION has a matching tag and
# cannot fail the way №444/CI did), and the native crash that made the bridge's
# `pipe_bidirectional` unusable was closed as №456 (root was consume-scope
# auto-cleanup disarm, not libuv).
socks = { git = "https://github.com/nv-lang/nova-socks", version = "0.1" }
