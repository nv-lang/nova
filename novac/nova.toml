# nova.toml — novac: the Nova compiler written in Nova.
#
# Plan 274 (docs/plans/274-novac-self-hosted-compiler.md). The architecture,
# module map and edge table live in docs/dev/novac-architecture.md; the module
# map is normative — check-novac-deps.sh parses the edge table from that
# document directly, so there is deliberately NO second machine-readable copy
# of the edges here (single source; class K4).
#
# Language pin (274 §1.1): novac tracks the spec at the pinned point below.
# D-blocks accepted after the pin queue up and are taken in batches; the lag
# is a number, not a feeling. Moving the pin is a conscious act, recorded in
# the plan.
#
# The three lines below are the MACHINE-READABLE contract (E1 review p.6;
# oracle-pin: plan 274 p.7 amendment, 2026-08-14): a future guard and the
# diff runner grep exactly these keys; edit them only as a conscious act
# recorded in the plan. oracle-pin = revision of the current compiler the
# diff gate compares against; it moves by a deliberate commit, mandatorily
# after each blocker window touching the novac subset (e.g. #659+#660).
# spec-queue IS COUNTED BY MACHINE (274.3/F13): the number of commits touching
# spec/decisions after spec-point; the diff runner compares it against the line
# below and reddens on a mismatch.
# IMPORTANT: the three lines below use a STRICT format "#   key: value" with no
# trailing comment -- otherwise the anchor misses them and the check switches
# itself off in silence (caught on ourselves 2026-08-15).
#   spec-point: 2026-08-14
# 19 -> 20 (2026-08-18): decision #719/D54 arrived -- a record-form variant can
# no longer be destructured positionally (`Circle(r)` for `Circle { radius f64 }`);
# the oracle answers E_RECORD_VARIANT_POSITIONAL_PATTERN. Measured the same day:
# novac rejects that program too, but for a DIFFERENT reason -- it does not parse
# the record form of a variant yet, so its refusal is unnamed. No divergence in
# the outcome; the rule lands together with the form (9.4a, class B).
# 20 -> 21 (2026-08-21): the D55 amendment arrived -- the newtype half of a
# single wrapper narrows to UNTYPED constants (`ro r Row = 7` as before,
# `take_row(i)` for a typed variable is E7301 and needs `Row(i)` or `i as Row`);
# sums untouched, the `#coerce` exit left open (R11 no longer counts a newtype
# pair as a duplicate). For novac this was a gain, not a debt: the rule named
# four places in its own source where a bare `int` flowed into an `FnRow`
# parameter, and all four were ONE crossing -- the polymorphic
# `CalleeRef.target_row` reaching the mangling door. Closed with a door carrying
# a precondition.
# 21 -> 24 (2026-08-23): the MEASURE changed, and the number moved with it. The
# queue used to be counted in whatever tree the run happened in -- 22 in this
# branch, 24 in CI, where the tree is this branch MERGED with main, for one and
# the same spec. A number that depends on who is looking is not a measure. It is
# now counted along main's own line with `--no-merges`, so a commit that merely
# CARRIED someone else's decisions (a merge) no longer counts as a decision, and
# branch and CI agree. Class K8, plan 274 section 9.1d.
# 26 -> 28 (2026-08-27): two commits from the integrator, both inside D239.
# The first writes the literal-capacity rule into the canon: an array literal is
# built with capacity EQUAL to its element count when that count is known at
# compile time, and NOT LESS than the number of known elements when it is not (a
# spread form). The rule is stated over the observable -- `[7, 8].cap() == 2` --
# rather than over the shape of the lowering, so it does not depend on which
# constructor an implementation uses. The second commit only puts the block's
# amendments back in chronological order.
# For novac this is not debt but the specification it was waiting for: its own
# emission already prints `_static_new(<count>)`. The oracle answers `cap=8`
# because with no capacity given a literal falls onto D232's default growth
# ("x2 growth, initial 8") -- it follows the canon as the canon was written,
# which is why the rule went into the spec instead of being filed as an
# implementation defect. Registry 221.1 #783 carries the measurement and the
# owner's routing: novac implements it, the oracle does not, not before the tag.
# 2026-08-29: 28 -> 29 -- the D200 clarification (module-const type is
# optional; the home of the rule is D184) is one more commit touching
# spec/decisions after spec-point. For novac's parser this is CONFIRMATION,
# not new work: bare `const X = 7` was already the shape its sources use.
# 2026-08-30: 29 -> 31 -- two commits of D467 (string literals): the norm
# itself (a closed escape list of three in backtick, `\` line continuation in
# "...", the bare backtick, body hygiene) and the amendment that made the tail
# of a block literal explicit -- symmetric to the head, Java text blocks rule.
# For novac this is REAL WORK, not confirmation: its lexer does not know
# backticks at all (research 2026-08-29, section 7), and 23 of its own test
# payloads use raw newlines inside "...", which D467 section 4 retracts. Plan
# 277 phase 2 carries that migration, and it is deliberately NOT done before
# phase 5 (body hygiene) -- migrating onto a form whose indent rules are not
# yet implemented would rewrite the payloads twice.
# 2026-08-30 (evening): 31 -> 36. Five commits touching spec/decisions, and
# main's CI was red on this line for three hours because of them (eight
# consecutive novac-gate refusals, 17:00-19:44). Judged commit by commit, and
# the split matters -- three are CONFIRMATION, two are REAL WORK:
#   * 89e06a79f (D467, 03-syntax.md) -- REAL WORK. The second oracle hunt found
#     two errors IN THE NORM itself; novac's lexer, which does not know
#     backticks at all, must be written against the corrected text, not the
#     text of 2026-08-29.
#   * 97888ce17 (D48 grammar, D467 section 2, D38, 02-types.md) -- REAL WORK for
#     the lexer: `\xNN` is a CODE POINT, not a byte, and the D48 grammar now
#     matches D467 section 6. The operator-precedence table in the same commit
#     (`??` at level 11, right-associative) is the specification novac's parser
#     was missing rather than new work: it records what the oracle already does.
#   * d97b71c48 (D86 amendment) -- CONFIRMATION. The decision is to KEEP `??`
#     for Option AND Result; nothing about the operator changes, and the
#     closure-fallback form is recorded as rejected.
#   * 0cfb6d420 (D467 section 2 note) -- CONFIRMATION of the same code-point
#     rule, written after the reverse probe was actually run.
#   * 9a14b0e6a (D55 protocol) -- CONFIRMATION, and not a parser matter at all:
#     it corrects a std contract that demanded a method retired by D372.
# THE JUDGEMENT ABOVE IS THE INTEGRATOR'S, and window 274 should verify the two
# REAL WORK entries against its own lexer -- the line is bumped here because
# main's CI judges main's file, and leaving it stale reddens every push for work
# that is not main's. Registry #843 relieved BRANCHES (the count runs to
# merge-base), which by construction cannot relieve main: there merge-base IS
# HEAD. That every spec commit on main reddens this line until it is bumped by
# hand is the same class #843 named, standing in a new place -- filed as #846,
# not papered over.
#   * d4045b51d (D86 AMEND 2026-09-01) -- REAL WORK, not urgent. `X ?? return R`
#     is legal where the enclosing fn returns neither Option nor Result. novac
#     needs a lexeme for `??` FIRST (window 274's measurement: its lexer has no
#     `??` token at all), then the expression, then the `?? return` production.
#     Nothing breaks by not adopting it -- the existing workarounds stay valid.
#     Why the amendment exists and what it replaces: docs/dev/novac-time-ledger.md,
#     2026-09-01. A manifest is not the place for the reasoning.
#   * D468 (2026-09-02) -- NOT urgent for novac, and cheaper than it looks.
#     A function learns its call site through an ORDINARY parameter with a
#     default: `fn ice(msg str, loc CallerLoc = caller_loc())`. There is no
#     attribute, no hidden parameter and no change to the function type or
#     the ABI -- an earlier draft had all three and the owner withdrew it the
#     same day. For novac's subset the rule is the one already applied to
#     `#realtime`: the name is recognised, the behaviour is Carina's own work,
#     on its own schedule. Nothing novac emits today changes.
#   * D468 AMEND (2026-09-03) -- the explicit override forms are WITHDRAWN.
#     Nothing to adopt: the contract grammar is unchanged, the second slot is
#     still a string literal only. For novac this is strictly LESS work than
#     the block asked for yesterday.
#   * D310 AMEND (2026-09-04) -- a set-blanket method counts as declared on
#     EVERY member of the set, conformance and bounds included. For novac this
#     is a note, not work: the subset has no type-sets yet, and when it gets
#     them the rule says conformance must ask the SAME method table as dispatch
#     -- which is the shape novac already has, and the oracle does not (#896).
#   * D52 AMEND (2026-09-04) -- binary operators over a numeric newtype are
#     legal only WITHIN one newtype (and with a literal); mixing two newtypes,
#     or a newtype with a bare int value, is an error. Owner's decision, donor
#     Go. For novac this is not work yet: the subset has no newtype operators
#     at all -- but when it gets them, the rule says the operator asks the same
#     door the call asks, which is the shape novac already wants.
#   * D470 (2026-09-07) -- the slice role `RangeIndex[V]`: a type supports
#     `a[x..y]` when it answers BOTH `@index(r Range)` and `@end_index() -> int`,
#     and an open end is materialized by the second method rather than by reading
#     a field named `len` (that half is an amendment to D238). For novac this IS
#     work, and it is small: the subset already routes `a[i]` through the method
#     table, so a slice asks the same table for two names instead of one. Worth
#     adopting early rather than late -- the oracle carried the opposite shape
#     until today, a type NAME in the condition plus a structural field as the
#     test, which is the kind of thing Carina exists in order not to inherit.
#   * D470 AMEND (2026-09-07) -- the role is asked of the SYNTACTIC slice
#     forms only; an explicit `Range` value passed as `x[r]` stays plain
#     `Index[Range, V]` and needs no `@end_index()`. For novac this narrows the
#     work rather than adding any: the subset lowers the sugar, so the question
#     is asked exactly where the sugar is expanded, and a Range value travels
#     as an ordinary argument.
# 62 -> 65 (2026-09-07): the counter was STALE, and the machine says so. Rule (above):
# the number of commits touching spec/decisions after spec-point. The hook computed 65
# while the line said 62 -- so three such commits went in without bumping it: two
# arrived with the merge of main (D470 slice role and the 284 codegen commit) and one
# is mine, plan 283.1 F.1, where the D178 amendment names the port's files and those
# files were renamed by the module split. NOT three new decisions: two are other
# windows' already-recorded ones, mine is a rename. The number is the counter's, not
# arithmetic of mine.
# 71 -> 72 (2026-09-13): D477 arrived -- sum placement and the `indirect`
# marker. A sum is placed BY VALUE and recursion is broken explicitly by a
# marker on the declaration; the marker sits on the unit whose size is computed
# separately (the VARIANT of a sum, the FIELD of a value-record). For novac this
# is a REQUIREMENT, not a debt (plan 274, T2): the oracle is not scheduled to
# implement it, so the divergence is deliberate and one-sided. Nothing in novac's
# own source uses a recursive sum today, so the queue entry costs it no work yet.
# 72 -> 73 (2026-09-13): D476 arrived -- a temporary consume value in a VIEW
# position expands into a consume scope instead of being refused, replacing
# exactly two D133 refusals. It adds NOTHING to the set of exempt binding forms:
# it reduces the new shape to the one form D432's #672 amendment already exempts.
# For novac the form is REQUIRED (plan 274.9 sec.2.7); the oracle is not
# scheduled. No debt for novac today: its own source has zero @cleanup methods
# and zero consume scopes, so the rule changes nothing in its build.
# 75 -> 76 (2026-09-16): TWO decisions of the owner arrived together.
# D478 -- how a BARE variant name is read: from one sum it resolves into it;
# from two or more, by the EXPECTED type of the position; with no expectation
# it is an error demanding `Type.Variant`. This one carries REAL debt for novac,
# and the debt is a CORRECTION, not new work: its refusal AMBIGUOUS_VARIANT_MSG
# rejects any bare name visible twice, so under D478 it refuses legal programs
# (plan 274.7, wave B14).
# D432 rev-2 -- a `consume` PARAMETER is auto-released like `consume X = e` when
# the type declares an effect-free @cleanup. No debt for novac today by the same
# measure as D476 above: its own source has zero @cleanup methods, so nothing in
# its build changes; the debt appears when wave 274.9 K4 reaches consume forms.
# 76 -> 77 (2026-09-16): D183 correction -- the spec read as a contradiction
# about `==`, and the owner's rule is to FIX the spec, not route around it.
# Three stale statements were removed from one D-block, each of which read as
# the norm: (1) `==` dispatches to `@eq` -- false, both compilers look up the
# name `equal` (emit_c.rs:36497, novac builtins.nv:99); (2) `Compare` embeds
# `Equal` and carries the default body -- superseded 130 lines below by the
# block's own amendment, and std holds the opposite (protocols.nv:83-85: the
# protocols are orthogonal, the default body sits on `Equal`); (3) a type with
# `@compare` and no `@equal` compiles only when `@equal` is explicit -- refuted
# by three probes on the oracle (a two-field type compared on ONE field returns
# true for `==`, while the same type WITHOUT `@compare` returns false, so the
# control makes the structural explanation impossible). The protocol method was
# also spelled `equals` throughout, which Plan 108.4 turned from an old spelling
# into an error (`@` is mandatory on protocol methods); the owner ordered it
# corrected, and it is.
# NO DEBT for novac, and the reason is a boundary rather than luck: its `==`
# handling returns early unless the receiver is `str` (check/operators.nv:39),
# so no user type reaches the equality rule at all. The default-body rule bites
# the day the subset takes `==` past `str`, and that day is not this wave.
# The Carina-side probe could not ask the question directly -- novac does not
# parse a record literal yet, so it refuses one form earlier. Read from the
# source instead, and said so.
# +1 (сторона `main`, 2026-09-16): D459 — операция эффекта объявляется
# словом `fn`. Хроники у этой правки не было — двинулся один счётчик; дописана при
# слиянии, ибо смысл строки — именно в том, чего решение стоит Карине.
# Долг Карины по D459 НЕ ИЗМЕРЕН мною и назван вопросом к интегратору: он
# вёл эту правку и миграцию 255 операций, а писать чужую мерку по догадке хуже, чем
# оставить пробел названным.
# 78 -> 79 (2026-09-18): D479 -- two spellings of one element answer alike, and a
# refusal names the FIRST segment that did not resolve. Raised by this window from
# registry 1150, number from the integrator, wording agreed with him.
# THE DEBT IS REAL AND IT IS A CORRECTION, not new work. The door shipped today
# (`@report_if_path_head_unknown`) judges the HEAD of a path. Under D479 that is the
# wrong question for the second spelling: `mod.Pointt.MAX` has `mod` as its head, so
# the door would ask about the module where the user misspelled the TYPE. It is a
# FIRST SLICE and the plan says so; the full form judges the RESOLUTION of the path.
# Cannot be finished today: the second spelling needs TWO files in one compilation
# unit, which is stage E2-b2. Named, not guessed.
# ALSO IN THIS COMMIT, and it is not a decision but a repair: D29's section
# "cyclic imports -- forbidden" was retracted by D291 two and a half months ago and
# still read as the norm. Marked retracted, the old text kept AS HISTORY with the
# reason it is kept -- a reader who arrives at D29 by search must learn he read
# something stale rather than conclude he is mad. No rev number: the norm did not
# change, only the text caught up. Zero cost for novac: it has no module cycles.
# 79 -> 80 (2026-09-18, Carina window): D422 called a generic `Vec[T]`/`[]T`
# Display "future" while the body stands in std/src/collections/vec/protocols.nv
# and a test prints PASS for it. The word is removed and the place named; the
# retracted wording is kept as a quote with what closed it, same form as the D29
# note above. Mirror of the same day's other find: there the overview lagged this
# D-block, here the D-block lagged the tree. No form starts or stops compiling,
# so the subset is untouched -- the counter moves because spec/decisions did.

# 76 -> 77 (2026-09-18): D38 amendment -- only a TYPE name may carry a turbofish;
# a VALUE name makes it indexing (registry 221.1 #676). The debt for novac is
# REAL but SMALL, and of the opposite sign to the usual one: the rule does not
# add work, it REMOVES it -- eight intermediate bindings `ro pj = vec[j]` across
# eight files exist only because the oracle lost the index. novac's own parser
# has no such ambiguity at all (it does not support turbofish), so there is
# nothing to reconcile there; the queue grows by one because the spec entry
# landed, while removing the workarounds is separate work for window 274.
#
# Written in English after the gate refused this manifest: a package manifest
# ships INSIDE the package repository and is read from outside (owner's rule,
# 2026-08-10). Mine was the only Cyrillic in 83 manifests.
# 80 -> 81 (слияние 2026-09-18): СЧЁТЧИКИ СТОЛКНУЛИСЬ НОМЕРАМИ.
# Обе стороны заняли «77» под РАЗНЫЕ решения: ветка — под правку D183,
# main — под амендмент D38 (#676). Счётчик считает КОММИТЫ, тронувшие
# spec/decisions, а не максимум двух веток: после слияния их СУММА —
# мои 80 плюс его один, которого в моём счёте не было. Взять большее из двух
# (80) значило бы потерять его коммит из счёта молча. Обе летописи ниже
# сохранены целиком — столкновение номеров видно только из них обеих.
# 81 -> 82 (2026-09-18, Carina window): D186 amendment by the owner's ruling --
# the protocol list is NON-EMPTY. `#impl()` and a bare `#impl` were neither
# allowed nor forbidden by the block; the owner called that an oversight, not a
# freedom, because the annotation means the author OPTED IN and opting into
# nothing opens no gate while still reading to a human as a decision.
# DEBT FOR CARINA: real but small, and it lands in the same merge -- the empty
# form was already refused, but as SUBSET debt; the amendment makes it a
# LANGUAGE error, so the door changes from `@report_*` to `@reject_*`.
# Found by asking the spec-reader agent for ALL forms of `#impl` (the owner's
# other rule of the same day): the agent answered that the spec says NOTHING
# about the empty list, and that named gap is what produced the amendment.
#
# D109 AMENDED 2026-09-18 (the owner's ruling): `display` prints `Point(1, 2)`
# and `Some(5)`, `debug` prints `Point { x: 1, y: 2 }`. The auto-derive table in
# `08-runtime.md` carried ONE row for both, because it was written 2026-06-05 --
# before D422 split Display from Debug -- so the single row handed Display the
# DEBUG form. Not a wrong design, an outdated one: the row gains a sibling
# rather than a retraction. The sum's "emits only type name" clause goes too;
# that clause called itself a V1 placeholder and carried its own followup
# marker, so the amendment executes what D109 already intended.
# HOW IT SURFACED: asking the spec-reader agent for the norm BEFORE writing the
# synthesis returned not a list but a FORK -- two D-blocks of equal rank saying
# different things. No default was taken, on purpose: the synthesized form is
# BYTES in stdout, so a wrong guess reddens every fixture printing a structural
# type. The question went to the owner and came back a ruling.
# DEBT FOR CARINA: the synthesis itself is not written yet -- this merge moves
# the NORM only, and the implementation follows in 274.7 B1b.
#
# 83 + 79 -> 85 (слияние origin/main 2026-09-18, окно Карины): НИ МАКСИМУМ,
# НИ СУММА ДВУХ ЧИСЕЛ — ЗАМЕР ОБЪЕДИНЁННОЙ ИСТОРИИ. Счётчик считает
# КОММИТЫ, тронувшие spec/decisions после spec-point, без слияний — а у
# двух веток есть ОБЩАЯ часть, поэтому 83+79 дало бы 162, а факт 85.
# Взять большее (83) значило бы потерять его два решения из счёта МОЛЧА,
# взять его (79) — потерять шесть моих. Число взято ТОЙ ЖЕ командой,
# которой судит страж (`novac-diff-corpus.sh:100`), а не арифметикой по двум
# числам: счётчик, выведенный из других счётчиков, не есть замер.
#
# 85 и 80 -> 86 (второе слияние 2026-09-19, окно Карины). ТОТ ЖЕ ЗАМЕР
# ТОЙ ЖЕ КОМАНДОЙ, что и накануне (`novac-diff-corpus.sh:100`), по объединённой
# истории двух линий. Ни максимум (85), ни сумма (165): у веток есть
# ОБЩАЯ часть. Второй раз за сутки — и это само по себе довод за то,
# чтобы счётчик считался, а не выводился: два разных слияния дали
# разные приращения (+2 и +1), и ни одно не угадывается из двух чисел.
#   spec-queue: 86
#   oracle-pin: 2803de2d9
#   stage: E2
# stage is the CURRENT stage of plan 274 (E1, E2, E2b1, E2b2, E2b3, E3, E4, E5,
# E6). It anchors self-expiring records: a temporary edge in the architecture's
# section 3 table is marked with the stage BEFORE which it is legal, and the
# moment stage moves past it, check-novac-temp-edges.sh reddens until the edge
# is removed by the same wave. Stage is moved by a deliberate commit that
# accepts a stage, never by hand along the way.

