# nova.toml — novac: the Nova compiler written in Nova.
#
# Plan 274 (docs/plans/274-novac-self-hosted-compiler.md). The architecture,
# module map and edge table live in docs/dev/novac-architecture.md; the module
# map is normative — check-novac-deps.sh parses the edge table from that
# document directly, so there is deliberately NO second machine-readable copy
# of the edges here (single source; class K4).
#
# Language pin (274 §1.1): novac tracks the spec at the pinned point below.
# D-blocks accepted after the pin queue up and are taken in batches; the lag
# is a number, not a feeling. Moving the pin is a conscious act, recorded in
# the plan.
#
# The three lines below are the MACHINE-READABLE contract (E1 review p.6;
# oracle-pin: plan 274 p.7 amendment, 2026-08-14): a future guard and the
# diff runner grep exactly these keys; edit them only as a conscious act
# recorded in the plan. oracle-pin = revision of the current compiler the
# diff gate compares against; it moves by a deliberate commit, mandatorily
# after each blocker window touching the novac subset (e.g. #659+#660).
# spec-queue IS COUNTED BY MACHINE (274.3/F13): the number of commits touching
# spec/decisions after spec-point; the diff runner compares it against the line
# below and reddens on a mismatch.
# IMPORTANT: the three lines below use a STRICT format "#   key: value" with no
# trailing comment -- otherwise the anchor misses them and the check switches
# itself off in silence (caught on ourselves 2026-08-15).
#   spec-point: 2026-08-14
# 19 -> 20 (2026-08-18): decision #719/D54 arrived -- a record-form variant can
# no longer be destructured positionally (`Circle(r)` for `Circle { radius f64 }`);
# the oracle answers E_RECORD_VARIANT_POSITIONAL_PATTERN. Measured the same day:
# novac rejects that program too, but for a DIFFERENT reason -- it does not parse
# the record form of a variant yet, so its refusal is unnamed. No divergence in
# the outcome; the rule lands together with the form (9.4a, class B).
# 20 -> 21 (2026-08-21): the D55 amendment arrived -- the newtype half of a
# single wrapper narrows to UNTYPED constants (`ro r Row = 7` as before,
# `take_row(i)` for a typed variable is E7301 and needs `Row(i)` or `i as Row`);
# sums untouched, the `#coerce` exit left open (R11 no longer counts a newtype
# pair as a duplicate). For novac this was a gain, not a debt: the rule named
# four places in its own source where a bare `int` flowed into an `FnRow`
# parameter, and all four were ONE crossing -- the polymorphic
# `CalleeRef.target_row` reaching the mangling door. Closed with a door carrying
# a precondition.
# 21 -> 24 (2026-08-23): the MEASURE changed, and the number moved with it. The
# queue used to be counted in whatever tree the run happened in -- 22 in this
# branch, 24 in CI, where the tree is this branch MERGED with main, for one and
# the same spec. A number that depends on who is looking is not a measure. It is
# now counted along main's own line with `--no-merges`, so a commit that merely
# CARRIED someone else's decisions (a merge) no longer counts as a decision, and
# branch and CI agree. Class K8, plan 274 section 9.1d.
# 26 -> 28 (2026-08-27): two commits from the integrator, both inside D239.
# The first writes the literal-capacity rule into the canon: an array literal is
# built with capacity EQUAL to its element count when that count is known at
# compile time, and NOT LESS than the number of known elements when it is not (a
# spread form). The rule is stated over the observable -- `[7, 8].cap() == 2` --
# rather than over the shape of the lowering, so it does not depend on which
# constructor an implementation uses. The second commit only puts the block's
# amendments back in chronological order.
# For novac this is not debt but the specification it was waiting for: its own
# emission already prints `_static_new(<count>)`. The oracle answers `cap=8`
# because with no capacity given a literal falls onto D232's default growth
# ("x2 growth, initial 8") -- it follows the canon as the canon was written,
# which is why the rule went into the spec instead of being filed as an
# implementation defect. Registry 221.1 #783 carries the measurement and the
# owner's routing: novac implements it, the oracle does not, not before the tag.
# 2026-08-29: 28 -> 29 -- the D200 clarification (module-const type is
# optional; the home of the rule is D184) is one more commit touching
# spec/decisions after spec-point. For novac's parser this is CONFIRMATION,
# not new work: bare `const X = 7` was already the shape its sources use.
# 2026-08-30: 29 -> 31 -- two commits of D467 (string literals): the norm
# itself (a closed escape list of three in backtick, `\` line continuation in
# "...", the bare backtick, body hygiene) and the amendment that made the tail
# of a block literal explicit -- symmetric to the head, Java text blocks rule.
# For novac this is REAL WORK, not confirmation: its lexer does not know
# backticks at all (research 2026-08-29, section 7), and 23 of its own test
# payloads use raw newlines inside "...", which D467 section 4 retracts. Plan
# 277 phase 2 carries that migration, and it is deliberately NOT done before
# phase 5 (body hygiene) -- migrating onto a form whose indent rules are not
# yet implemented would rewrite the payloads twice.
#   spec-queue: 31
#   oracle-pin: 2803de2d9
#   stage: E2
# stage is the CURRENT stage of plan 274 (E1, E2, E2b1, E2b2, E2b3, E3, E4, E5,
# E6). It anchors self-expiring records: a temporary edge in the architecture's
# section 3 table is marked with the stage BEFORE which it is legal, and the
# moment stage moves past it, check-novac-temp-edges.sh reddens until the edge
# is removed by the same wave. Stage is moved by a deliberate commit that
# accepts a stage, never by hand along the way.

[package]
name = "novac"
version = "0.0.1"
nova-version = "0.5"
license = "MIT OR Apache-2.0"
description = "The Nova compiler, in Nova (plan 274; E1 subset)"
repository = "https://github.com/nv-lang/nova.git"

[lib]
src = "src"
