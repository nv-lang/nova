[package]
name = "nova-driver"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
publish = false

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nova-driver-support = { path = "../nova-driver-support" }
