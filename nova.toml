# nova.toml — the workspace for every piece of Nova code in this project.
#
# This file declares the workspace per [D78](spec/decisions/07-modules.md#d78).
# The compiler itself — `compiler-codegen/` — is a Rust crate with its own
# Cargo.toml and is NOT part of the Nova workspace.
#
# Inside the Nova workspace:
#   - std/        — the Nova standard library (.nv modules grouped by domain)
#   - examples/   — demo programs and tutorial snippets (they consume std)
#   - nova_tests/ — language tests (the corpus for compiler-codegen)
#
# Directory name == package.name inside it (D78 path/module enforcement).

[workspace]
members = [
    "std",
    "examples",
    "nova_tests",
    "spec_tests",
]
