# SPDX-License-Identifier: MIT OR Apache-2.0
# Plan 116 Ф.0.5 — nova_tls_shim: C-ABI staticlib поверх rustls для std/tls.
#
# ОТДЕЛЬНЫЙ крейт, НЕ зависимость nova-codegen (правило
# feedback_third_party_libs: dep-tree компилятора = clap+anyhow, не трогаем).
# Артефакт (nova_tls_shim.lib / libnova_tls_shim.a) линкуется в user-бинарь
# УСЛОВНО по факту использования tls_* символов — механизм brotli (D337),
# интеграция в test_runner.rs — Ф.2.
#
# Крипто-провайдер: ring (НЕ дефолтный aws-lc-rs — тот требует cmake+nasm на
# Windows; ring собирается имеющимся cc/clang/MSVC). Trust store: webpki-roots
# (Mozilla bundle, вкомпилирован). Обоснование — план 116, «Ключевое решение
# Ф.0-2 (R-1)».

[package]
name = "nova_tls_shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Nova std/tls C-ABI shim over rustls (Plan 116)"
publish = false

[lib]
name = "nova_tls_shim"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
# Пин минорной линии; ТОЧНЫЙ пин всего дерева — Cargo.lock (закоммичен, R-9).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
# SHA-256 для SPKI-pinning (Ф.4.3). Уже в дереве транзитивно (rustls feature ring)
# → новых крейтов в lock не добавляет; прямая зависимость — чтобы звать digest.
ring = "0.17"

[profile.release]
# panic через FFI-границу = UB → abort. Размер/скорость: opt-level по умолчанию (3).
panic = "abort"
lto = true

[profile.dev]
panic = "abort"
