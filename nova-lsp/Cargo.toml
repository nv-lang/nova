[package]
name = "nova-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Nova language LSP server — production-grade IDE integration (Plan 104)"
publish = false

[[bin]]
name = "nova-lsp"
path = "src/main.rs"

[lib]
name = "nova_lsp"
path = "src/lib.rs"

[dependencies]
# LSP framework: JSON-RPC routing, message dispatch, tower service middleware.
# Used by many production Rust LSP servers (taplo-lsp, wgsl-analyzer, etc.).
tower-lsp = "0.20"

# Async runtime: multi-thread scheduler for concurrent file handling.
tokio = { version = "1", features = ["full"] }

# Lock-free concurrent hashmap: URI → ParsedFile cache (Plan 104.0.3+).
dashmap = "5"

# Efficient rope data structure for incremental text edits.
# Handles UTF-8 multi-byte chars, large files, O(log n) slice/insert.
ropey = "1"

# Structured error handling
anyhow = "1"

# Structured logging to stderr (stdout is used for JSON-RPC transport)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI argument parsing: --version, --help; future: --workspace-root
clap = { version = "4", features = ["derive"] }

# Nova compiler as library — Plan 104.1 diagnostics phase.
# path = "../compiler-codegen" resolves relative to this Cargo.toml.
nova_codegen = { path = "../compiler-codegen", package = "nova-codegen" }

# CancellationToken for per-uri debounce cancellation (Plan 104.1.Ф.3).
tokio-util = { version = "0.7", features = ["rt"] }

# JSON value construction for dynamic capability registration options
# (Plan 104.10 Ф.18: didChangeWatchedFiles register_options).
serde_json = "1"

# Serialize/Deserialize derive for the persistent on-disk index cache
# (Plan 215) — lsp_types (SymbolKind/Range/Position/Url) already implement
# these traits (they are the JSON-RPC wire types), so deriving on our own
# cache structs is all that's needed; no new wire format required.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Needed in integration tests that spawn child processes with async helpers
tokio = { version = "1", features = ["full"] }
# JSON-RPC message serialization/deserialization in lifecycle + integration tests
serde_json = "1"
# Temporary directories for workspace tests (Plan 104.1)
tempfile = "3"
# `Stream::next()` on tower-lsp's `ClientSocket` loopback — write-after-
# destroyed shutdown-gate test drains the real server→client channel to
# prove background tasks stop sending once `shutting_down` is set.
futures = "0.3"
# `ServiceExt::ready()` to drive the real `LspService` through `initialize`
# in the same test (tower-lsp's `Client` no-ops every send until the server
# state machine reaches `Initialized`).
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = "symbols"   # lean binary for editor installer distribution

[profile.dev]
opt-level = 0
debug = true
